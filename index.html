
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">
        <div class="form-container">

            <h1>Multi-Step Form</h1>
            <p class="description">Complete the form step by step.</p>

            <!-- Progress Bar -->
            <div class="progress-info">
                <span id="stepText">Step 1 of 3</span>
                <span id="progressPercent">33%</span>
            </div>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

            <form id="multiStepForm" novalidate>

                <!-- Step 1 -->
                <section class="form-step active">
                    <h2>Personal Information</h2>

                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your name" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>

                    <p class="error-message" aria-live="polite"></p>

                    <div class="button-group">
                        <button type="button" class="next-btn">Next</button>
                    </div>
                </section>

                <!-- Step 2 -->
                <section class="form-step">
                    <h2>Address Details</h2>

                    <label for="address">Street Address</label>
                    <input type="text" id="address" name="address"
                           placeholder="Enter your address" required>

                    <label for="city">City</label>
                    <input type="text" id="city" name="city"
                           placeholder="Enter your city" required>

                    <p class="error-message" aria-live="polite"></p>

                    <div class="button-group">
                        <button type="button" class="prev-btn">Previous</button>
                        <button type="button" class="next-btn">Next</button>
                    </div>
                </section>

                <!-- Step 3 -->
                <section class="form-step">
                    <h2>Confirm Your Information</h2>
                    <p>Please review your details before submitting.</p>

                    <div id="summary" class="summary"></div>

                    <p class="error-message" aria-live="polite"></p>

                    <div class="button-group">
                        <button type="button" class="prev-btn">Previous</button>
                        <button type="submit" class="submit-btn">Submit</button>
                    </div>
                </section>

                <!-- Success Message -->
                <section id="successMessage" class="success-message" hidden>
                    <h2>Form Completed!</h2>
                    <p>Your information has been submitted successfully.</p>
                </section>

            </form>
        </div>
    </main>
</body>
</html>
